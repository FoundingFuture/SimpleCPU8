# Linux and Windows distributions, each on arm64 and x86_64. Every job runs
# ./d on a host of its own kind, so nothing is cross compiled. It then
# installs the archive with the installer users run, to check the two agree. macOS
# is built on a Mac with ./d --upload, see the header of ./d.
#
# A v* tag also drafts the GitHub Release with these four archives. The
# macOS two are uploaded to the draft, and the release is published by hand.
name: dist

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     arch: x86_64, name: linux-x86_64 }
          - { os: ubuntu-24.04-arm, arch: arm64,  name: linux-arm64 }
          - { os: windows-2022,     arch: x86_64, name: windows-x86_64 }
          - { os: windows-11-arm,   arch: arm64,  name: windows-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages raylib builds against
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libxcursor-dev libxinerama-dev libxkbcommon-dev
      - name: Distribution
        shell: bash
        run: ./d --arch ${{ matrix.arch }}
      # The C runtime is linked statically, so every program imports Windows
      # system DLLs alone. This is the allowed list. A Visual C++ runtime DLL,
      # or any DLL not on the list, fails the job.
      - name: Imports are Windows system DLLs only
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $allowed = @('KERNEL32.dll', 'USER32.dll', 'GDI32.dll', 'SHELL32.dll', 'WINMM.dll', 'IMM32.dll')
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find 'VC\Tools\MSVC\**\bin\Host*\*\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { throw "no dumpbin.exe" }
          $exes = @(Get-ChildItem dist\simplecpu-*\bin\*.exe)
          if ($exes.Count -ne 6) { throw "expected the six programs, found $($exes.Count)" }
          $bad = @()
          foreach ($exe in $exes) {
            $dlls = @()
            foreach ($line in (& $dumpbin /nologo /dependents $exe.FullName)) {
              if ($line -match '^\s+(\S+\.dll)\s*$') { $dlls += $Matches[1] }
            }
            Write-Host "$($exe.Name): $($dlls -join ', ')"
            foreach ($dll in $dlls) {
              if ($dll -match '^(vcruntime|msvcp|ucrtbase|api-ms-win-crt-)') { $bad += "$($exe.Name) links the C runtime as a DLL: $dll" }
              elseif ($allowed -notcontains $dll) { $bad += "$($exe.Name) imports $dll, which is not on the allowed list" }
            }
          }
          if ($bad.Count -gt 0) { $bad | ForEach-Object { Write-Host $_ }; throw "imports outside the allowed list" }
      - name: Install with install.sh
        if: runner.os == 'Linux'
        run: |
          sh packaging/install.sh --archive dist/*.tar.gz --no-path
          test -x ~/.local/share/simplecpu-8/bin/simplecpu-ide
          test -f ~/.local/share/applications/simplecpu-8.desktop
          test -f ~/.config/simplecpu-8/examples/README.md
          ~/.local/share/simplecpu-8/bin/simplecpu-asm ~/.config/simplecpu-8/examples/assembly/hello/hello.asm -o "$RUNNER_TEMP/hello.rom"
      # Windows PowerShell 5.1 is what `irm | iex` runs in on a fresh machine.
      - name: Install with install.ps1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $zip = (Get-Item dist\*.zip).FullName
          & .\packaging\install.ps1 -Archive $zip -NoPath
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\SimpleCPU-8\bin\simplecpu-ide.exe")) { throw "no simplecpu-ide.exe" }
          if (-not (Test-Path "$env:APPDATA\SimpleCPU-8\examples\README.md")) { throw "no examples" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\SimpleCPU-8.lnk")) { throw "no shortcut" }
          & "$env:LOCALAPPDATA\Programs\SimpleCPU-8\bin\simplecpu-asm.exe" "$env:APPDATA\SimpleCPU-8\examples\assembly\hello\hello.asm" -o "$env:RUNNER_TEMP\hello.rom"
          if ($LASTEXITCODE -ne 0) { throw "simplecpu-asm failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: simplecpu-${{ matrix.name }}
          path: dist/*.tar.gz
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: simplecpu-${{ matrix.name }}-zip
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: archives
          merge-multiple: true
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" archives/* --repo "$GITHUB_REPOSITORY" --draft \
            --title "SimpleCPU-8 ${GITHUB_REF_NAME#v}" \
            --notes "Draft: upload the macOS archives with ./d --arch arm64 --upload and ./d --arch x86_64 --upload, then publish."
